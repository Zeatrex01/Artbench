# The whole suite on a Mac, started by hand (Actions > mac > Run workflow): on a private repository a macOS minute
# counts ten times a Linux one, so it does not run at every push.
name: mac

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: The source launcher starts the server
        run: |
          python -m artbench --no-browser --port 8799 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/api/projects >/dev/null && echo answered && exit 0; sleep 1; done
          echo "the server did not answer"; exit 1
