# A version tag publishes the downloads: push a tag named v<version> (the version in artbench/__init__.py, e.g.
# v0.1.0). Windows is built on Windows and each Mac build on a Mac with that chip (Apple silicon, Intel); each is
# started with its own Python and asked whether it answers, and only when all answered is the GitHub Release created
# with the zips and the Blender add-on. Each zip goes up twice: with its version, and under a name that never changes
# (Artbench-windows-x64.zip, Artbench-macos-arm64.zip, Artbench-macos-x64.zip), so .../releases/latest/download/<name>
# (the README's and the page's lasting links) always fetches the newest. Not a pre-release: GitHub's "latest" skips those.
#   git tag v0.1.1 && git push origin v0.1.1
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the version
        shell: pwsh
        run: |
          $version = python -c "import artbench; print(artbench.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but artbench.__version__ is $version" }
      - name: Build the portable folder and the add-on
        run: |
          python tools/build_portable.py
          python -m artbench addon dist/artbench_bridge.zip
      - name: Start it with its own Python and ask it
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/Artbench-*-windows-x64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP/p"
          $app = "$env:RUNNER_TEMP/p/Artbench"
          $p = Start-Process -FilePath "$app/python/python.exe" -ArgumentList "-m", "artbench", "--no-browser", "--port", "8799" -WorkingDirectory $app -PassThru
          $answer = $null
          for ($i = 0; $i -lt 30 -and -not $answer; $i++) {
            Start-Sleep -Seconds 1
            try { $answer = Invoke-RestMethod -Uri http://127.0.0.1:8799/api/alive -TimeoutSec 2 } catch { }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $answer -or $answer.app -ne "artbench") { throw "the portable Artbench did not answer" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Artbench-*-windows-x64.zip
            dist/artbench_bridge.zip

  mac:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest          # Apple silicon
          - arch: x64
            runner: macos-15-intel        # Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the portable folder
        run: python tools/build_portable.py --target mac-${{ matrix.arch }}
      - name: Start it with its own Python and ask it
        run: |
          unzip -q dist/Artbench-*-macos-${{ matrix.arch }}.zip -d "$RUNNER_TEMP/p"
          cd "$RUNNER_TEMP/p/Artbench"
          bash -n Artbench.command
          ./python/bin/python3.12 -m artbench --no-browser --port 8799 &
          pid=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8799/api/alive | grep -q '"artbench"'; then ok=1; break; fi
            sleep 1
          done
          kill $pid
          [ -n "$ok" ] || { echo "the portable Artbench did not answer"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/Artbench-*-macos-${{ matrix.arch }}.zip

  publish:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          cp Artbench-*-windows-x64.zip Artbench-windows-x64.zip           # the same files under names that never change
          cp Artbench-*-macos-arm64.zip Artbench-macos-arm64.zip
          cp Artbench-*-macos-x64.zip Artbench-macos-x64.zip
          notes="Windows: download Artbench-windows-x64.zip, unzip it anywhere (not inside a game project) and double-click Artbench.bat.
          Mac: Artbench-macos-arm64.zip for Apple silicon (M1 and later), Artbench-macos-x64.zip for an Intel Mac; unzip it and double-click Artbench.command (the first time: right-click it, Open, then Open).
          Python is inside each; nothing to install. The Blender add-on is inside the folder too, and attached here on its own (Blender 4.2+: Get Extensions > Install from Disk)."
          gh release create "${{ github.ref_name }}" Artbench-*.zip artbench_bridge.zip --title "Artbench ${{ github.ref_name }}" --notes "$notes"
